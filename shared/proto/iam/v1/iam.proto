syntax = "proto3";

package iam.v1;

option go_package = "github.com/ossirdian/magistral/shared/pkg/iam/v1;iamv1";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

service IAMService {
  rpc CreateUser(CreateUserRequest) returns (User);
  rpc GetUser(GetUserRequest) returns (User);
  rpc GetUserByEmail(GetUserByEmailRequest) returns (User);
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
  rpc UpdateUser(UpdateUserRequest) returns (User);
  rpc ActivateUser(ActivateUserRequest) returns (User);
  rpc DeactivateUser(DeactivateUserRequest) returns (User);
  rpc SetUserPassword(SetUserPasswordRequest) returns (google.protobuf.Empty);
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc RefreshSession(RefreshSessionRequest) returns (RefreshSessionResponse);
  rpc RequestPasswordReset(RequestPasswordResetRequest) returns (google.protobuf.Empty);
  rpc ConfirmPasswordReset(ConfirmPasswordResetRequest) returns (google.protobuf.Empty);
  rpc ValidateToken(ValidateTokenRequest) returns (ValidateTokenResponse);
}

enum UserRole {
  USER_ROLE_UNSPECIFIED = 0;
  USER_ROLE_SUPER_ADMIN = 1;
  USER_ROLE_ADMIN = 2;
  USER_ROLE_OWNER = 3;
  USER_ROLE_INSTRUCTOR = 4;
}

enum UserStatus {
  USER_STATUS_UNSPECIFIED = 0;
  USER_STATUS_ACTIVE = 1;
  USER_STATUS_INACTIVE = 2;
  USER_STATUS_SUSPENDED = 3;
}

message User {
  string id = 1;
  optional string school_id = 2;
  string email = 3;
  UserRole role = 4;
  UserStatus status = 5;
  bool is_active = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

message Identity {
  string user_id = 1;
  UserRole role = 2;
  optional string school_id = 3;
}

message PageMeta {
  int32 limit = 1;
  int32 offset = 2;
  int32 count = 3;
}

message CreateUserRequest {
  optional string school_id = 1;
  string email = 2;
  string password = 3;
  UserRole role = 4;
  UserStatus status = 5;
}

message GetUserRequest {
  string user_id = 1;
}

message GetUserByEmailRequest {
  string email = 1;
}

message ListUsersRequest {
  optional string school_id = 1;
  optional UserRole role = 2;
  optional UserStatus status = 3;
  optional string search = 4;
  int32 limit = 5;
  int32 offset = 6;
}

message ListUsersResponse {
  repeated User users = 1;
  PageMeta meta = 2;
}

message UpdateUserRequest {
  string user_id = 1;
  optional string email = 2;
  optional UserRole role = 3;
  optional UserStatus status = 4;
  optional bool is_active = 5;
}

message ActivateUserRequest {
  string user_id = 1;
}

message DeactivateUserRequest {
  string user_id = 1;
  optional string reason = 2;
}

message SetUserPasswordRequest {
  string user_id = 1;
  string password = 2;
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message LoginResponse {
  string access_token = 1;
  string refresh_token = 2;
  google.protobuf.Timestamp expires_at = 3;
  Identity identity = 4;
}

message RefreshSessionRequest {
  string refresh_token = 1;
}

message RefreshSessionResponse {
  string access_token = 1;
  string refresh_token = 2;
  google.protobuf.Timestamp expires_at = 3;
  Identity identity = 4;
}

message RequestPasswordResetRequest {
  string email = 1;
}

message ConfirmPasswordResetRequest {
  string token = 1;
  string new_password = 2;
}

message ValidateTokenRequest {
  string access_token = 1;
}

message ValidateTokenResponse {
  string user_id = 1;
  UserRole role = 2;
  optional string school_id = 3;
  UserStatus status = 4;
  bool is_active = 5;
  bool is_valid = 6;
}
