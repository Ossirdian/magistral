get:
  tags:
    - Instructors
  operationId: getInstructor
  summary: Get instructor by id
  parameters:
    - $ref: ../params/common.yaml#/InstructorId
  responses:
    '200':
      description: Instructor details.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/responses/instructor-response.yaml#/InstructorResponse
    '401':
      $ref: ../components/responses/unauthorized.yaml#/Unauthorized
    '403':
      $ref: ../components/responses/forbidden.yaml#/Forbidden
    '404':
      $ref: ../components/responses/not-found.yaml#/NotFound
    default:
      $ref: ../components/responses/default-error.yaml#/DefaultError

patch:
  tags:
    - Instructors
  operationId: patchInstructor
  summary: Update instructor partially
  parameters:
    - $ref: ../params/common.yaml#/InstructorId
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas.yaml#/InstructorPatchRequest
  responses:
    '200':
      description: Updated instructor.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/responses/instructor-response.yaml#/InstructorResponse
    '400':
      $ref: ../components/responses/bad-request.yaml#/BadRequest
    '401':
      $ref: ../components/responses/unauthorized.yaml#/Unauthorized
    '403':
      $ref: ../components/responses/forbidden.yaml#/Forbidden
    '404':
      $ref: ../components/responses/not-found.yaml#/NotFound
    '409':
      $ref: ../components/responses/conflict.yaml#/Conflict
    default:
      $ref: ../components/responses/default-error.yaml#/DefaultError

delete:
  tags:
    - Instructors
  operationId: deleteInstructor
  summary: Delete instructor
  parameters:
    - $ref: ../params/common.yaml#/InstructorId
  responses:
    '204':
      description: Instructor deleted.
    '401':
      $ref: ../components/responses/unauthorized.yaml#/Unauthorized
    '403':
      $ref: ../components/responses/forbidden.yaml#/Forbidden
    '404':
      $ref: ../components/responses/not-found.yaml#/NotFound
    '409':
      $ref: ../components/responses/conflict.yaml#/Conflict
    default:
      $ref: ../components/responses/default-error.yaml#/DefaultError

