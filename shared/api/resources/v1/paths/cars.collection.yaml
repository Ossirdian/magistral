get:
  tags:
    - Cars
  operationId: listCars
  summary: List cars
  parameters:
    - $ref: ../params/common.yaml#/BranchId
    - $ref: ../params/common.yaml#/CarStatus
    - $ref: ../params/common.yaml#/InstructorFilterId
    - $ref: ../params/common.yaml#/AvailabilityStatus
    - $ref: ../params/common.yaml#/Limit
    - $ref: ../params/common.yaml#/Offset
  responses:
    '200':
      description: Paginated cars list.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/responses/car-list-response.yaml#/CarListResponse
    '400':
      $ref: ../components/responses/bad-request.yaml#/BadRequest
    '401':
      $ref: ../components/responses/unauthorized.yaml#/Unauthorized
    '403':
      $ref: ../components/responses/forbidden.yaml#/Forbidden
    default:
      $ref: ../components/responses/default-error.yaml#/DefaultError

post:
  tags:
    - Cars
  operationId: createCar
  summary: Create car
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas.yaml#/CarCreateRequest
  responses:
    '201':
      description: Created car.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/responses/car-response.yaml#/CarResponse
    '400':
      $ref: ../components/responses/bad-request.yaml#/BadRequest
    '401':
      $ref: ../components/responses/unauthorized.yaml#/Unauthorized
    '403':
      $ref: ../components/responses/forbidden.yaml#/Forbidden
    '409':
      $ref: ../components/responses/conflict.yaml#/Conflict
    default:
      $ref: ../components/responses/default-error.yaml#/DefaultError

