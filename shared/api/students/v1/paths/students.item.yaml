get:
  tags:
    - Students
  operationId: getStudent
  summary: Get student by id
  parameters:
    - $ref: ../params/common.yaml#/StudentId
  responses:
    '200':
      description: Student details.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/responses/student-response.yaml#/StudentResponse
    '401':
      $ref: ../components/responses/unauthorized.yaml#/Unauthorized
    '403':
      $ref: ../components/responses/forbidden.yaml#/Forbidden
    '404':
      $ref: ../components/responses/not-found.yaml#/NotFound
    default:
      $ref: ../components/responses/default-error.yaml#/DefaultError

patch:
  tags:
    - Students
  operationId: patchStudent
  summary: Update student partially
  parameters:
    - $ref: ../params/common.yaml#/StudentId
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas.yaml#/StudentPatchRequest
  responses:
    '200':
      description: Updated student.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/responses/student-response.yaml#/StudentResponse
    '400':
      $ref: ../components/responses/bad-request.yaml#/BadRequest
    '401':
      $ref: ../components/responses/unauthorized.yaml#/Unauthorized
    '403':
      $ref: ../components/responses/forbidden.yaml#/Forbidden
    '404':
      $ref: ../components/responses/not-found.yaml#/NotFound
    '409':
      $ref: ../components/responses/conflict.yaml#/Conflict
    default:
      $ref: ../components/responses/default-error.yaml#/DefaultError

delete:
  tags:
    - Students
  operationId: deleteStudent
  summary: Delete student
  parameters:
    - $ref: ../params/common.yaml#/StudentId
  responses:
    '204':
      description: Student deleted.
    '401':
      $ref: ../components/responses/unauthorized.yaml#/Unauthorized
    '403':
      $ref: ../components/responses/forbidden.yaml#/Forbidden
    '404':
      $ref: ../components/responses/not-found.yaml#/NotFound
    '409':
      $ref: ../components/responses/conflict.yaml#/Conflict
    default:
      $ref: ../components/responses/default-error.yaml#/DefaultError
