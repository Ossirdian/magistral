get:
  tags:
    - Groups
  operationId: listGroups
  summary: List groups
  parameters:
    - $ref: ../params/common.yaml#/BranchId
    - $ref: ../params/common.yaml#/Search
    - $ref: ../params/common.yaml#/Limit
    - $ref: ../params/common.yaml#/Offset
  responses:
    '200':
      description: Paginated groups list.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/responses/group-list-response.yaml#/GroupListResponse
    '400':
      $ref: ../components/responses/bad-request.yaml#/BadRequest
    '401':
      $ref: ../components/responses/unauthorized.yaml#/Unauthorized
    '403':
      $ref: ../components/responses/forbidden.yaml#/Forbidden
    default:
      $ref: ../components/responses/default-error.yaml#/DefaultError

post:
  tags:
    - Groups
  operationId: createGroup
  summary: Create group
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas.yaml#/GroupCreateRequest
  responses:
    '201':
      description: Created group.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/responses/group-response.yaml#/GroupResponse
    '400':
      $ref: ../components/responses/bad-request.yaml#/BadRequest
    '401':
      $ref: ../components/responses/unauthorized.yaml#/Unauthorized
    '403':
      $ref: ../components/responses/forbidden.yaml#/Forbidden
    '409':
      $ref: ../components/responses/conflict.yaml#/Conflict
    default:
      $ref: ../components/responses/default-error.yaml#/DefaultError
