get:
  tags:
    - Schools
  operationId: getSchool
  summary: Get school by id
  parameters:
    - $ref: ../params/common.yaml#/SchoolId
  responses:
    '200':
      description: School details.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/responses/school-response.yaml#/SchoolResponse
    '401':
      $ref: ../components/responses/unauthorized.yaml#/Unauthorized
    '403':
      $ref: ../components/responses/forbidden.yaml#/Forbidden
    '404':
      $ref: ../components/responses/not-found.yaml#/NotFound
    default:
      $ref: ../components/responses/default-error.yaml#/DefaultError

patch:
  tags:
    - Schools
  operationId: patchSchool
  summary: Update school partially
  parameters:
    - $ref: ../params/common.yaml#/SchoolId
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas.yaml#/SchoolPatchRequest
  responses:
    '200':
      description: Updated school.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/responses/school-response.yaml#/SchoolResponse
    '400':
      $ref: ../components/responses/bad-request.yaml#/BadRequest
    '401':
      $ref: ../components/responses/unauthorized.yaml#/Unauthorized
    '403':
      $ref: ../components/responses/forbidden.yaml#/Forbidden
    '404':
      $ref: ../components/responses/not-found.yaml#/NotFound
    '409':
      $ref: ../components/responses/conflict.yaml#/Conflict
    default:
      $ref: ../components/responses/default-error.yaml#/DefaultError

delete:
  tags:
    - Schools
  operationId: deleteSchool
  summary: Soft delete school
  parameters:
    - $ref: ../params/common.yaml#/SchoolId
  responses:
    '204':
      description: School deleted.
    '401':
      $ref: ../components/responses/unauthorized.yaml#/Unauthorized
    '403':
      $ref: ../components/responses/forbidden.yaml#/Forbidden
    '404':
      $ref: ../components/responses/not-found.yaml#/NotFound
    '409':
      $ref: ../components/responses/conflict.yaml#/Conflict
    default:
      $ref: ../components/responses/default-error.yaml#/DefaultError
