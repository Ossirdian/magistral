post:
  tags: [Documents]
  operationId: generateDocument
  parameters:
    - $ref: ../params/headers.yaml#/Authorization
    - $ref: ../params/headers.yaml#/XRequestID
    - $ref: ../params/headers.yaml#/XCorrelationID
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas.yaml#/DocumentGenerateRequest
  responses:
    '200':
      description: Generated document
      content:
        application/json:
          schema:
            $ref: ../components/schemas/responses/document-response.yaml#/DocumentResponse
    '400':
      $ref: ../components/responses/bad-request.yaml#/BadRequest
    '401':
      $ref: ../components/responses/unauthorized.yaml#/Unauthorized
    '404':
      $ref: ../components/responses/not-found.yaml#/NotFound
    '409':
      $ref: ../components/responses/conflict.yaml#/Conflict
    default:
      $ref: ../components/responses/default-error.yaml#/DefaultError
