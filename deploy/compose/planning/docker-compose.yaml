services:
  app-planning:
    build:
      context: ../../..
      dockerfile: deploy/docker/planning/Dockerfile
    image: ${APP_IMAGE_NAME}
    container_name: app-planning
    env_file:
      - .env
    expose:
      - "${PLANNING_METRICS_PORT}"
    ports:
      - "${PLANNING_EXTERNAL_METRICS_PORT}:${PLANNING_METRICS_PORT}"
    logging:
      driver: gelf
      options:
        gelf-address: "udp://127.0.0.1:12201"
        tag: "app-planning"
    restart: unless-stopped
    networks:
      - magistral-microservices

networks:
  magistral-microservices:
    name: magistral-microservices
    external: true
