services:
  app-frontend:
    build:
      context: ../../..
      dockerfile: deploy/docker/frontend/Dockerfile
    image: ${APP_IMAGE_NAME}
    container_name: app-frontend
    env_file:
      - .env
    expose:
      - "${HTTP_PORT}"
    restart: unless-stopped
    networks:
      - magistral-microservices

networks:
  magistral-microservices:
    name: magistral-microservices
    external: true
