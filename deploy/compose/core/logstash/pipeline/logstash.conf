input {
  gelf {
    port => 12201
    use_udp => true
  }
}

filter {
  if [short_message] {
    json {
      source => "short_message"
      target => "app"
      skip_on_invalid_json => true
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "magistral-logs-%{+YYYY.MM.dd}"
  }
  stdout { codec => rubydebug }
}
